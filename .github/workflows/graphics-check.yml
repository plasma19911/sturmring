name: Graphics smoke test
on:
  pull_request:
    paths: ['index.html', 'tests/**', '.github/workflows/graphics-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/graphics-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-check
          path: test-results/
          retention-days: 7
