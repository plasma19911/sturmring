:root{

.hero-t h1{font-size:30px;letter-spacing:.02em;line-height:1}
.hero-t p{color:#c9d3db;margin-top:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:16px;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.prof{flex-direction:row;align-items:center;gap:14px}
.lvl{font:700 26px/1 var(--disp);color:var(--amber);min-width:62px;text-align:center}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.field{display:flex;flex-direction:column;gap:4px}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;margin-block:-6px}

.startbar{position:sticky;bottom:0;padding:16px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 38%);margin-top:4px}
.go{width:100%;border:0;border-radius:12px;padding:15px;background:var(--amber);color:#1b1404;font:700 18px var(--disp);letter-spacing:.06em;text-transform:uppercase}

.go.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}

#match{position:fixed;inset:0;background:#a9cbd9;z-index:20;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(1.3) contrast(1.15)}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.top-row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;max-width:62vw}
.big{background:rgba(12,17,23,.82);border:1px solid var(--line);border-radius:10px;padding:5px 10px 4px;display:flex;flex-direction:column;align-items:center;min-width:56px}
.big b{font:700 21px/1.05 var(--disp);color:var(--amber);font-variant-numeric:tabular-nums}
.big span{font-size:10.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.mapn{align-self:flex-start;background:rgba(12,17,23,.82);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px}
.zone{background:rgba(12,17,23,.82);border:1px solid rgba(164,92,255,.5);border-radius:8px;padding:4px 9px 7px;font-size:13px;color:#d9c2ff;min-width:176px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}

#vig.hit{box-shadow:inset 0 0 70px 18px rgba(240,60,40,.6)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(12,17,23,.92);border:1px solid var(--me);border-radius:10px;padding:8px 16px;text-align:center;font:700 15px var(--disp);letter-spacing:.05em;text-transform:uppercase;color:var(--me);white-space:nowrap;pointer-events:none}

.vals{display:flex;gap:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vals b{color:var(--fg);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;max-width:62vw}

.pill.zone{color:#d9c2ff;border-color:rgba(164,92,255,.5)}

#mini{width:118px;height:118px;border-radius:10px;border:1px solid var(--line);background:#101820;display:block}

.hud-bot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px}
.status{background:rgba(12,17,23,.85);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

.status .who b{font:600 14px var(--disp);color:var(--me)}
.status .who span{color:var(--muted)}
.hb{height:9px;border-radius:5px;background:#26313c;overflow:hidden}
.hb i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.hb.s{height:5px}.hb.s i{background:var(--shield)}
.hb.st{height:4px}.hb.st i{background:var(--amber)}
.inv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.82fr);gap:4px;font-variant-numeric:tabular-nums}
.inv svg{display:block;width:100%;height:16px;fill:currentColor;color:var(--fg);margin-bottom:1px}
.inv div.g{border-style:dashed}
.inv div{background:#1b2530;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:6px;padding:3px 4px;font-size:10.5px;line-height:1.25;color:var(--muted);overflow:hidden;white-space:nowrap}
.inv div b{display:block;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.inv div.on{background:var(--amber-soft);border-left-color:var(--amber);border-right-color:var(--amber);border-bottom-color:var(--amber)}
.speed{display:flex;gap:6px}
.speed button{flex:1;border:1px solid var(--line);background:rgba(12,17,23,.85);border-radius:10px;padding:10px 0;font:600 14px var(--disp);white-space:nowrap}

.res-top{text-align:center;padding:18px 0 4px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.stats div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font:700 20px var(--disp);font-variant-numeric:tabular-nums}
.xp{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.xp div{display:flex;justify-content:space-between}
.xp .sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--amber)}
.unl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.unl li{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:8px 10px}
.unl li b{font-family:var(--disp)}
.unl.next li{background:var(--panel2);border:1px dashed var(--line);color:var(--muted)}

@media (max-width:360px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.go:active{transform:none}}
</style>

  auNoise(v,q[1]*(1+d/900),q[0]*(1-.75*d/1100),0,pan);if(d<700)auTone(v*.9,q[2],q[2]*.33,q[1]*.8,pan);if(d>350)auNoise(v*.35,.3,500,0,pan,.05+d/3000);auShotExtra(id,v,d,pan)}
function auEvent(e){const pan=panOf(e.x,e.y),d=Math.hypot(e.x-cam.x,e.y-cam.y),k=Math.pow(Math.max(0,1-d/800),2);
  if(e.k==='chest'){auNoise(.2*k,.1,1100,300,pan);auTone(.14*k,120,260,.18,pan,.02,'triangle')}
  else if(e.k==='pick')auNoise(.1,.035,5200,1700);
  else if(e.k==='hurt'){auTone(.32,170,55,.12);auNoise(.16,.06,800)}
  else if(e.k==='kill'){auNoise(.22,.05,3200,900);auTone(.34,95,42,.22)}
  else if(e.k==='dead'){auTone(.4,210,34,.7);auNoise(.2,.5,500)}
  else if(e.k==='heal'){auNoise(.12*k,.18,2800,900,pan);auNoise(.1*k,.12,1800,600,pan,.2);auTone(.08*k,180,320,.4,pan,.1,'triangle')}
  else if(e.k==='shield'){auNoise(.1*k,.5,7000,3000,pan);auTone(.09*k,220,620,.45,pan,.05,'triangle')}
  else if(e.k==='throw'){auNoise(.12*k,.03,5000,2500,pan);auNoise(.1*k,.25,1500,400,pan,.08);auNoise(.08*k,.04,2500,800,pan,.75)}
  else if(e.k==='boom'){const q=Math.pow(Math.max(0,1-d/1400),2);auNoise(.7*q,.55,700,0,pan);auTone(.7*q,72,26,.55,pan);auNoise(.3*q,.9,300,0,pan,.08);for(let i=0;i<4;i++)auNoise(.06*q,.05,3000,1000,pan,.25+i*.13+rnd()*.08)}
  else if(e.k==='drop'){auNoise(.2,.8,900,200);auTone(.2,300,90,.6)}
  else if(e.k==='wumms'){auTone(.18*k,90,40,.12,pan);auNoise(.12*k,.08,900,0,pan)}
  else if(e.k==='break')auNoise(.16*k,.07,4200,1500,pan)}
function sounds(m,ts){if(!AU.on||!AU.ctx){heardT=m.t;m.ev.length=0;return}
  let n=0;for(let i=m.noise.length-1;i>=0&&n<5;i--){const q=m.noise[i];if(q.t<=heardT)break;const d=Math.hypot(q.x-cam.x,q.y-cam.y);if(d<1100){n++;auShot(q.w,d,panOf(q.x,q.y))}}
  heardT=m.t;for(const e of m.ev)auEvent(e);m.ev.length=0;
  const s=m.storm,dd=Math.hypot(cam.x-s.x,cam.y-s.y)-s.r;AU.storm.gain.setTargetAtTime(clamp(.05+(dd+500)/500*.32,.04,.42),AU.ctx.currentTime,.4);
  if(spec&&spec.alive&&spec.mv&&ts-stepT>(spec.run?230:330)/Math.min(speed,2)){stepT=ts;const B=m.B,r=spec.run;
    if(B.snow){auNoise(.07,.09,2600,900);auNoise(.03,.06,900)}
    else if(B.ind||B.city){auNoise(.06,.03,3200,700);auTone(.03,140,90,.04)}
    else if(m.biome==='wueste'){auNoise(.06,.08,3500,1500)}
    else if(m.biome==='wald'){auNoise(.05,.06,r?900:650);if(rnd()<.25)auNoise(.05,.02,4000,2000,0,.03)}
    else auNoise(.05,.06,r?700:480,150)}
  if(spec&&spec.alive){const busy=spec.act==='heal';if(busy&&ts-(AU.healT||0)>420){AU.healT=ts;auNoise(spec.useK==='s'?.05:.06,.12,spec.useK==='s'?5000:2400,700)}
    const rl=spec.rel>0;if(rl&&!AU.rl){auNoise(.09,.04,3000,1200);auNoise(.08,.05,2200,900,0,.35)}if(!rl&&AU.rl&&spec.mags[spec.cur]>0)auNoise(.1,.04,3600,1500);AU.rl=rl}
  /* Schritte anderer Bots in Hörweite, mit Richtung */
  if(ts-stepO>260){stepO=ts;let k=0;gNear(m.bg,cam.x,cam.y,260,o=>{if(k>=3||o===spec||!o.alive||!o.mv||o.pose)return;const d=Math.hypot(o.x-cam.x,o.y-cam.y),hr=o.run?260:150;if(d<hr){k++;auNoise(.05*Math.pow(1-d/hr,1.5)+.006,.05,o.run?600:400,0,clamp((o.x-cam.x)/200,-1,1),rnd()*.12)}})}}
function auStop(){if(AU.ctx)AU.storm.gain.setTargetAtTime(0,AU.ctx.currentTime,.2)}
$('sndBtn').addEventListener('click',()=>{AU.on=!AU.on;$('sndBtn').textContent=AU.on?'🔊':'🔇';if(AU.on)auInit();if(AU.ctx)AU.master.gain.value=AU.on?.8:0});
function toEnd(){if(cur&&(!P.alive||cur.over))finish()}

function finish(){if(mode!=='match')return;auStop();const win=P.place===1,m=cur,N=m.N;
  const r={place:P.place||1,kills:P.kills,dmg:Math.round(P.dmg),stormDmg:P.stormDmg,meds:P.meds,chests:P.chests,sniperKill:!!P.sniperKill,longKill:!!P.longKill,hs:P.hs,gold:P.gold,grenKills:P.grenKills,hadV3:P.hadV3,time:win?m.t:P.deathT,win,biome:m.biome};
  const xp=[['Platzierung',Math.round((N-r.place)/N*250)],['Eliminierungen',r.kills*15],['Schaden',Math.round(r.dmg/4)],['Kisten',r.chests*3]];if(win)xp.push(['Sieg',600]);
  const sum=xp.reduce((a,b)=>a+b[1],0),lv0=S.level;
  const share=0,bonus=win?100:r.place<=25?50:r.place<=100?25:0,kept=Math.min(100,bonus+r.gold);
  S.chestTotal=(S.chestTotal||0)+r.chests;S.goldTotal=(S.goldTotal||0)+kept;S.wk=S.wk||{};for(const k in P.wk)S.wk[k]=(S.wk[k]||0)+P.wk[k];S.grenTotal=(S.grenTotal||0);S.hsTotal=(S.hsTotal||0)+r.hs;S.grenTotal=(S.grenTotal||0)+r.grenKills;S.games++;lbSend(r);S.kills+=r.kills;S.gold+=kept;if(win)S.wins++;if(!S.best||r.place<S.best)S.best=r.place;if(!S.maps[m.biome]||r.place<S.maps[m.biome])S.maps[m.biome]=r.place;S.xp+=sum;
  const achNew=ACH.filter(a=>!S.achDone.includes(a.id)&&(a.f(S)||0)>=a.goal);for(const a of achNew){S.achDone.push(a.id);S.xp+=a.xp;S.gold+=a.gold}
  while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++}
  const fresh=UNLOCKS.filter(u=>!has(u.id)&&u.test(r,S));fresh.forEach(u=>S.unlocked.push(u.id));store();
  let tip;
  if(win)tip='Letzter von 1000. Besser geht es nicht.';
  else if(P.selfK)tip='Dein Bot hat sich mit der eigenen Rakete erwischt. Mehr Abstand hilft: probier „Vorsichtig“.';
  else if(!P.killer)tip='Der Sturm hat deinen Bot erwischt. Mit „Früh rotieren“ ist er rechtzeitig in der Zone.';
  else if(P.wp.length===1&&P.wp[0].id==='pistol')tip='Dein Bot hatte bis zum Schluss nur die Pistole. Am Rand landen gibt ihm mehr Ruhe für die ersten Kisten.';
  else if(P.killer.tier>=4)tip=`${P.killer.name} war Level ${P.killer.lvl}. Gegen solche Gegner hilft ein höherer Wert bei „In Deckung gehen“.`;
  else if(r.place>700)tip='Früh ausgeschieden. „Erst ausrüsten“ und ein höherer Deckungswert halten ihn länger am Leben.';
  else if(r.kills===0&&r.dmg<40)tip='Kaum Schaden ausgeteilt. Punkte in „Zielen“ helfen beim Treffen.';
  else tip='Solide Runde. Punkte in „Leben“ und „Startschild“ machen ihn in späten Kämpfen zäher.';
  const mm=Math.floor(r.time/60),ss=String(Math.floor(r.time%60)).padStart(2,'0'),next=UNLOCKS.filter(u=>!has(u.id)).slice(0,3);
  $('result').innerHTML=`<div class="res-top"><p class="eyebrow">Runde ${S.games} · ${m.B.n}</p><h2 class="${win?'win':''}">${win?'Sieg':'Platz '+r.place} <small>von ${N}</small></h2>
    <p class="hint">${win?'Dein Bot hat alle überlebt.':P.killer?`Eliminiert von ${P.killer.name} (Lvl ${P.killer.lvl}) mit ${WEAPONS[P.killW].n}`:P.selfK?'Von der eigenen Rakete erwischt':'Im Sturm gestorben'}${!win&&m.winner?` · Sieger: ${m.winner.name}`:''}</p></div>
    <section class="card"><dl class="stats"><div><dt>Eliminierungen</dt><dd>${r.kills}</dd></div><div><dt>Schaden</dt><dd>${r.dmg}</dd></div><div><dt>Kopfschüsse</dt><dd>${r.hs}</dd></div><div><dt>Überlebt</dt><dd>${mm}:${ss}</dd></div><div><dt>Kisten geöffnet</dt><dd>${r.chests}</dd></div><div><dt>Medikits benutzt</dt><dd>${r.meds}</dd></div><div><dt>Gold gesichert${share&&share<1?' ('+share*100+' %)':''}</dt><dd>${kept} <small style="font:500 12px var(--body);color:var(--muted)">${bonus?bonus+' Platzierung':'keine Platzierung'}${r.gold?' + '+Math.min(r.gold,kept-bonus)+' Kopfgeld':''}</small></dd></div></dl></section>
    ${(P.klog||[]).length||P.killer?`<section class="card"><h2>Killfeed <small>${(P.klog||[]).length} Eliminierungen</small></h2><ul class="kf">${(P.klog||[]).map(k=>{const t=Math.floor(k.t/60)+':'+String(Math.floor(k.t%60)).padStart(2,'0');
      return `<li><time>${t}</time><span class="kw">${ICON[k.w]||ICON.pistol}</span><span class="kn"><b>${k.n}</b><small>${k.w==='gren'?'Granate':WEAPONS[k.w]?WEAPONS[k.w].n:''}${k.hs?' · Kopfschuss':''}</small></span><i style="color:${k.tier>=0?TIERS[k.tier].c:'#35e0c8'}">Lvl ${k.l}</i></li>`}).join('')}${P.killer?`<li class="dead"><time>${mm}:${ss}</time><span class="kw">${ICON[P.killW]||ICON.pistol}</span><span class="kn"><b>${P.killer.name}</b><small>hat dich eliminiert · ${WEAPONS[P.killW].n}</small></span><i style="color:${TIERS[P.killer.tier]?TIERS[P.killer.tier].c:'#fff'}">Lvl ${P.killer.lvl}</i></li>`:''}</ul></section>`:''}
    <section class="card"><h2>Erfahrung</h2><div class="xp">${xp.map(x=>`<div><span>${x[0]}</span><span>+${x[1]}</span></div>`).join('')}<div class="sum"><span>Gesamt</span><span>+${sum} EP</span></div></div>
    ${S.level>lv0?`<ul class="unl"><li><b>Stufe ${S.level} erreicht</b><br>+${2*(S.level-lv0)} Skillpunkte zum Verteilen</li></ul>`:''}</section>
    ${achNew.length?`<section class="card"><h2>Erfolge erreicht</h2><ul class="unl">${achNew.map(a=>`<li><b>${a.name}</b><br>${a.desc} · +${fmt(a.xp)} EP${a.gold?' · +'+a.gold+' Gold':''}</li>`).join('')}</ul></section>`:''}
    ${fresh.length?`<section class="card"><h2>Neu freigeschaltet</h2><ul class="unl">${fresh.map(u=>`<li><b>${u.name}</b>${u.desc?'<br>'+u.desc:''}</li>`).join('')}</ul></section>`:''}
    <section class="card"><h2>Rundenanalyse</h2><p>${tip}</p>${next.length?`<p class="hint">Als Nächstes freischaltbar:</p><ul class="unl next">${next.map(u=>`<li><b>${u.name}</b><br>${u.cond}</li>`).join('')}</ul>`:''}</section>
    <div class="startbar"><div class="stack" style="gap:8px"><button class="go" id="again">Nochmal mit dieser Einstellung</button><button class="go ghost" id="back">Bot anpassen</button></div></div>`;
  cur=null;demo=null;renderLobby();show('result');
  $('again').addEventListener('click',begin);$('back').addEventListener('click',()=>{show('lobby');if(still)staticDemo()})}

function fit(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}return[r.width,r.height,d]}
function drawMini(m,focus){const cv=$('mini'),[w,h,d]=fit(cv),g=cv.getContext('2d'),k=w/m.W,s=m.storm;
  g.setTransform(d,0,0,d,0,0);g.drawImage(miniBase,0,0,w,h);
  g.fillStyle='rgba(122,46,234,.6)';g.beginPath();g.rect(0,0,w,h);g.arc(s.x*k,s.y*k,Math.max(.01,s.r*k),0,TAU);g.fill('evenodd');
  if(s.nr>0){g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.arc(s.nx*k,s.ny*k,s.nr*k,0,TAU);g.stroke()}
  g.fillStyle='#ff9a7a';const bs=m.bots,z=m.alive>200?1:2;for(let i=0;i<bs.length;i++){const b=bs[i];if(b.alive&&!b.isP)g.fillRect(b.x*k-z/2,b.y*k-z/2,z,z)}
  g.fillStyle='#ff3030';for(const q of m.drops)if(!q.open)g.fillRect(q.x*k-3,q.y*k-3,6,6);
  if(m.bounty&&m.bounty.alive){g.strokeStyle='#ffd34d';g.lineWidth=2;g.beginPath();g.arc(m.bounty.x*k,m.bounty.y*k,5,0,TAU);g.stroke()}
  if(focus){g.fillStyle=focus.isP?'#35e0c8':'#fff';g.strokeStyle='#0f151c';g.lineWidth=1.5;g.beginPath();g.arc(focus.x*k,focus.y*k,4.5,0,TAU);g.fill();g.stroke();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1;g.beginPath();g.arc(focus.x*k,focus.y*k,9,0,TAU);g.stroke()}}
function hud(m){const s=m.storm,p=m.ph[s.ph],f=spec||P;
  $('hAlive').textContent=m.alive;$('hKills').textContent=P.kills;
  $('hZone').textContent=s.r<=.5?'Zone geschlossen':s.shr?`Zone ${s.ph+1} von ${m.ph.length} schrumpft`:`Zone ${s.ph+1} von ${m.ph.length} schrumpft in ${Math.ceil(p.wait-s.t)} s`;
  $('hZoneBar').style.width=(s.r<=.5?0:s.shr?clamp(1-(s.t-p.wait)/p.shrink,0,1):clamp(1-s.t/p.wait,0,1))*100+'%';
  $('sVals').innerHTML=`<span>Leben <b>${Math.ceil(f.hp)}</b> / ${f.max}</span><span>Schild <b>${Math.round(f.sh)}</b></span><span>Ausdauer <b>${Math.round(f.sta/f.staMax*100)} %</b></span>`;
  $('sArm').innerHTML=`<span>Weste <b>${f.vest?'T'+f.vest:'–'}</b>${f.vest?' ('+Math.ceil(f.vestD)+')':''}</span><span>Helm <b>${f.helm?'T'+f.helm:'–'}</b>${f.helm?' ('+f.helmD+'×)':''}</span><span>Gold <b>${f.gold}</b></span>`;
  if(P.kills>lastK){lastK=P.kills;const e=m.feed.slice().reverse().find(q=>q.ap);if(e){$('toast').innerHTML=`Eliminiert<small>${e.b} · ${e.w}</small>`;$('toast').hidden=false;toastT=performance.now()+2600}}
  if(toastT&&performance.now()>toastT){toastT=0;$('toast').hidden=true}
  $('feed').innerHTML=m.feed.filter(e=>e.t>m.t-7&&(e.me||(Math.abs(e.x-cam.x)<900&&Math.abs(e.y-cam.y)<900))).slice(-4).map(e=>e.sys?`<li class="me"><b>${e.sys}</b></li>`:`<li class="${e.me?'me':''}">${e.a?`<b class="${e.ap?'p':''}">${e.a}</b> › `:''}<b class="${e.bp?'p':''}">${e.b}</b> · ${e.w}</li>`).join('');
  $('sName').textContent=f.isP?`${f.name} · Lvl ${f.lvl}`:`Zuschauen: ${f.name} (Lvl ${f.lvl})`;$('sState').textContent=f.alive?f.state+(f.jump>0?' · springt':f.run?' · sprintet':f.exh?' · außer Atem':'')+(Math.hypot(f.x-s.x,f.y-s.y)>s.r?' · im Sturm':''):'Eliminiert';$('sSt').style.width=f.sta/f.staMax*100+'%';
  $('sHp').style.width=f.hp/f.max*100+'%';$('sSh').style.width=Math.min(100,f.sh)+'%';
  const cell=(col,icon,name,sub,on)=>`<div class="${on?'on':''}" style="border-top-color:${col};background:linear-gradient(${col}33,#1b2530 70%)">${icon}<b>${name}</b>${sub}</div>`;
  const cells=f.wp.map((w,i)=>cell(RAR[w.rar].c,ICON[w.id],SHORT[w.id],f.rel>0&&i===f.cur?'lädt':f.mags[i]+' Schuss',i===f.cur));
  if(f.med>0)cells.push(cell('#74d66b',ICON.med,'Medikit','×'+f.med));if(f.pot>0)cells.push(cell('#4aa8ff',ICON.pot,'Schild','×'+f.pot));
  while(cells.length<5)cells.push('<div><svg viewBox="0 0 48 22"></svg><b>&nbsp;</b>leer</div>');
  cells.push(f.gren>0?cell('#8a9a5a',ICON.gren,'Granate','×'+f.gren+' / 2').replace('<div class=""','<div class="g"'):`<div class="g" style="opacity:.55">${ICON.gren}<b>Granate</b>× 0 / 2</div>`);
  $('sInv').innerHTML=cells.join('')}

function newDemo(){demo=newMatch(null,{n:36,W:3000});const b=demo.bots[0];b.skin=S.cfg.skin;b.isP=true;b.name='Dein Bot';b.tier=-1;demoSpec=b;dcam.x=b.x;dcam.y=b.y;demo.focus=dcam;
  if(!demoView&&!noGL){demoView=makeView($('demo'));if(!demoView){noGL=true;$('heroP').textContent='Dieses Gerät unterstützt keine 3D-Darstellung im Browser.'}}
  if(demoView)demoView.load(demo)}
function staticDemo(){newDemo();for(let i=0;i<300;i++)step(demo);const b=demo.bots[0].alive?demo.bots[0]:demo.bots.find(o=>o.alive);requestAnimationFrame(t=>demoView&&demoView.render(demo,b.x,b.y,DCAM,t,.016,1,b))}

function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(mode==='match'&&cur){const t0=performance.now();
    acc+=dt*speed;let n=0;while(acc>=DT&&n<12&&!cur.over&&performance.now()-t0<22){step(cur);acc-=DT;n++;}if(acc>DT*3)acc=0;const al=speed>1?1:clamp(acc/DT,0,1);
    if(!P.alive&&!deadShown){deadShown=true;spec=P.killer&&P.killer.alive?P.killer:null;
      $('deadH').textContent='Platz '+P.place+' von '+cur.N;$('deadP').textContent=P.killer?`Eliminiert von ${P.killer.name} (Lvl ${P.killer.lvl}) mit ${WEAPONS[P.killW].n}`:P.selfK?'Von der eigenen Rakete erwischt':'Im Sturm gestorben';$('dead').hidden=false}
    if(!spec||!spec.alive){if(spec&&spec.killer&&spec.killer.alive)spec=spec.killer;else{let bd=1e9,nb=null;for(const b of cur.bots)if(b.alive){const d=Math.hypot(b.x-cam.x,b.y-cam.y);if(d<bd){bd=d;nb=b}}spec=nb||cur.winner||P}}
    /* Kamera dreht auf Wunsch langsam hinter den Bot, sonst bleibt Norden oben */
    {let tg=S.cfg.camRot&&spec?Math.atan2(-Math.cos(spec.a),-Math.sin(spec.a)):0,dq=tg-camYaw;dq=Math.atan2(Math.sin(dq),Math.cos(dq));camYaw+=dq*(1-Math.exp(-dt*(S.cfg.camRot?1.1:3)))}
    const kf=1-Math.pow(.0001,dt);cam.x+=(spec.px+(spec.x-spec.px)*al-cam.x)*kf;cam.y+=(spec.py+(spec.y-spec.py)*al-cam.y)*kf;
    if(mainView)mainView.render(cur,cam.x,cam.y,CAMS[camI],ts,dt*Math.min(speed,3),al,spec,camYaw);{const st=cur.storm,vc=!P.alive?'':P.flash>0?'hit':Math.hypot(P.x-st.x,P.y-st.y)>st.r?'storm':'';if(vc!==vigC){vigC=vc;$('vig').className=vc}}
    hudN++;if(hudN%8===0)hud(cur);if(hudN%24===4)drawMini(cur,spec);sounds(cur,ts);
    if(cur.over){if(!endT&&P.place===1&&AU.on&&AU.ctx)for(let i=0;i<3;i++){auTone(.4,110+i*30,50,.3,0,i*.22);auNoise(.2,.12,1600,0,0,i*.22)}if(!endT)endT=ts;else if(ts-endT>2600)finish()}}
  else if(mode==='lobby'&&!still&&!document.hidden&&!noGL){
    if(!demo||demo.over||demo.t>90)newDemo();
    if(!demo)return;step(demo);
    if(!demoSpec||!demoSpec.alive)demoSpec=(demoSpec&&demoSpec.killer&&demoSpec.killer.alive)?demoSpec.killer:demo.bots.find(b=>b.alive);
    if(demoSpec&&demoView){dcam.x+=(demoSpec.x-dcam.x)*.08;dcam.y+=(demoSpec.y-dcam.y)*.08;demoView.render(demo,dcam.x,dcam.y,DCAM,ts,dt,1,demoSpec)}}}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
idbGet().then(j=>{if(!j)return store();try{const o=JSON.parse(j);if(xpOf(o)>xpOf(S)){localStorage.setItem(KEY,j);S=loadSave();renderLobby()}else store()}catch(e){}});
renderLobby();
if(still)staticDemo();
requestAnimationFrame(frame);
}
